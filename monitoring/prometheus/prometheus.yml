global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - alert_rules.yml

scrape_configs:
  - job_name: backend          # API, model, drift, pipeline and dependency metrics
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
  - job_name: node             # infrastructure
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
